html, body { margin: 0; height: 100%; background: #b59b74; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; color: #2b1d16; }
canvas { display: block; position: fixed; inset: 0; }
.ov { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  background: rgba(43, 29, 22, 0.55); padding: 20px; box-sizing: border-box; z-index: 5; }
.ov.show { display: flex; animation: fadein .18s ease-out; }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
.ov h1 { margin: 0; font-size: 38px; font-weight: 800; color: #efe2c4; letter-spacing: 1px; text-align: center;
  -webkit-text-stroke: 2px #2b1d16; paint-order: stroke fill; text-shadow: 0 4px 0 #2b1d16; line-height: 1.05; }
.ov .sub { font-size: 18px; color: #efe2c4; font-weight: 600; text-align: center; max-width: 420px; text-shadow: 0 2px 0 #2b1d16; }
.cards { display: flex; flex-direction: column; gap: 12px; width: min(420px, 100%); }
.card { display: flex; align-items: center; gap: 14px; background: #efe2c4; border: 4px solid #2b1d16; border-radius: 18px;
  padding: 12px 16px; min-height: 76px; box-shadow: 0 6px 0 #2b1d16; cursor: pointer; text-align: left; font: inherit; color: inherit;
  transform: translateY(20px); opacity: 0; animation: cardin .25s ease-out forwards; }
.card:nth-child(2) { animation-delay: .07s } .card:nth-child(3) { animation-delay: .14s }
@keyframes cardin { to { transform: none; opacity: 1 } }
.card:active { transform: translateY(4px); box-shadow: 0 2px 0 #2b1d16; }
.card .gl { flex: 0 0 52px; height: 52px; border-radius: 50%; border: 4px solid #2b1d16; background: #c97a3c; color: #efe2c4;
  display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; box-sizing: border-box; }
.card .nm { font-size: 22px; font-weight: 800; line-height: 1.1; }
.card .ds { font-size: 16px; font-weight: 500; line-height: 1.2; color: #4a372a; }
.btn { font: inherit; font-size: 24px; font-weight: 800; color: #efe2c4; background: #c8442f; border: 4px solid #2b1d16; border-radius: 18px;
  padding: 10px 34px; min-height: 60px; box-shadow: 0 6px 0 #2b1d16; cursor: pointer; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2b1d16; }
.stats { background: #efe2c4; border: 4px solid #2b1d16; border-radius: 18px; padding: 12px 18px; font-size: 18px; font-weight: 600;
  display: grid; grid-template-columns: auto auto; gap: 2px 18px; box-shadow: 0 6px 0 #2b1d16; }
.stats b { font-weight: 800; text-align: right; }
.tip { font-size: 18px; color: #2b1d16; background: #d9a53a; border: 3px solid #2b1d16; border-radius: 14px; padding: 8px 14px; max-width: 400px; text-align: center; font-weight: 600; }
#build { position: fixed; right: 6px; bottom: 4px; font-size: 11px; color: rgba(43,29,22,.45); z-index: 2; pointer-events: none; }
</style>
</head>

      '...P...'] },
    { name: 'Hydroponics', tip: 'Pop the egg sac!', map: [
      '.......',
      '.#.n.#.',
      '.......',
      'g.....g',
      '..#.#..',
      '.V...V.',
      '.......',
      '...s...',
      'P......'] },
    { name: 'Engine Room', tip: "Brutes don't budge", map: [
      's.....s',
      '.......',
      '..#.#..',
      '...b...',
      'V.....V',
      '.......',
      '.g...g.',
      '.......',
      '...P...'] },
    { name: 'Bridge', tip: 'Make them hit each other', map: [
      's..n..s',
      '.#...#.',
      '.......',
      '..b.g..',
      'V..#..V',
      '.......',
      '.g...g.',
      '.V...V.',
      '...P...'] },
    { name: 'Hive Core', tip: 'The Queen', map: [
      '.......',
      '.V...V.',
      '.......',
      '...Q...',
      '.......',
      '#.....#',
      '.......',
      '.V...V.',
      '...P...'] },
  ];

  const UPGRADES = [
    { id: 'heavy',  name: 'Heavy Wrench',  desc: 'Knockback pushes 2 tiles.', glyph: '»' },
    { id: 'chain',  name: 'Shock Coil',    desc: 'Hits also zap aliens next to the target.', glyph: 'ϟ' },
    { id: 'suit',   name: 'Patched Suit',  desc: '+2 max HP and heal 2.', glyph: '+', stack: true },
    { id: 'charge', name: 'Running Start', desc: 'Step twice the same way, then bump: +2 damage.', glyph: '➜' },
    { id: 'thorns', name: 'Spiky Plating', desc: 'Aliens that hurt you take 2 damage.', glyph: '✸' },
    { id: 'leech',  name: 'Snack Break',   desc: 'Every 3 kills heals 1.', glyph: '♥' },
    { id: 'adren',  name: 'Adrenaline',    desc: 'After a CLOSE dodge, next bump deals +2.', glyph: '!' },
    { id: 'decomp', name: 'Decompression', desc: 'Venting an alien sucks nearby aliens toward the vent.', glyph: '◎' },
    { id: 'wall',   name: 'Wall Lover',    desc: 'SLAMs deal +2 instead of +1.', glyph: '▣' },
    { id: 'boots',  name: 'Greased Boots', desc: 'Step faster.', glyph: '≫' },
  ];

  function rng(seed) {
    let s = (seed >>> 0) || 1;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }

  function create(seed) {
    const g = {
      seed, rnd: rng(seed), room: 0, phase: 'play', t: 0, nextId: 1,
      grid: null, enemies: [], events: [], ups: {}, options: null, clearT: 0, tut: null,
      player: { x: 3, y: 4, hp: 5, maxHp: 5, cd: 0, queue: null, lastDir: null, streak: 0, inv: 0, adren: false, kills: 0, face: 'right' },
      stats: { kills: 0, vented: 0, close: 0, slams: 0, clonks: 0, oops: 0, time: 0, hits: 0 },
      lostTo: null,
    };
    loadRoom(g, 0);
    return g;
  }

  function emit(g, ev) { g.events.push(ev); }
  function range(g, r) { return r[0] + (r[1] - r[0]) * g.rnd(); }
  function inB(x, y) { return x >= 0 && y >= 0 && x < W && y < H; }
  function tile(g, x, y) { return inB(x, y) ? g.grid[y][x] : '#'; }
  function walkable(g, x, y) { const t = tile(g, x, y); return t === '.'; }
  function alive(g) { return g.enemies.filter(e => !e.dead); }
  function enemyAt(g, x, y) { return g.enemies.find(e => !e.dead && e.x === x && e.y === y) || null; }
  function occupied(g, x, y) { return !!enemyAt(g, x, y) || (g.player.x === x && g.player.y === y); }
  function manh(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
  function cheb(a, b) { return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); }

  function addEnemy(g, type, x, y, extra) {
    const T = TYPES[type];
    const e = Object.assign({ id: g.nextId++, type, x, y, hp: T.hp, maxHp: T.hp, state: 'idle', timer: range(g, T.think) * 0.6,
      wt: 0, wdur: 0, tele: null, stun: 0, spawnT: 0, sleep: false, dead: false, deadT: 0, cause: null, pi: 0 }, extra || {});
    g.enemies.push(e);
    return e;
  }

  function loadRoom(g, i) {
    g.room = i; g.phase = 'play'; g.clearT = 0; g.options = null;
    const R = ROOMS[i];
    g.grid = R.map.map(row => row.split('').map(c => (c === '#' || c === 'V') ? c : '.'));
    g.enemies = [];
    const p = g.player;
    p.cd = 0; p.queue = null; p.lastDir = null; p.streak = 0; p.inv = 0; p.adren = false;
    let k = 0;
    R.map.forEach((row, y) => row.split('').forEach((c, x) => {
      if (c === 'P') { p.x = x; p.y = y; }
      const type = { g: 'grub', z: 'grub', s: 'spitter', b: 'brute', n: 'nest', Q: 'queen' }[c];
      if (type) {
        const e = addEnemy(g, type, x, y);
        if (c === 'z') e.sleep = true;
        else e.spawnT = 0.55 + 0.12 * k++;
      }
    }));
    g.tut = i === 0 ? { step: 0 } : null;
    emit(g, { type: 'room', room: i, name: R.name, tip: R.tip });
  }

  // ---------- người chơi ----------
  function step(g, dir) {
    if (g.phase !== 'play' && g.phase !== 'cleared') return;
    const p = g.player;
    if (p.cd > 0) { p.queue = dir; return; }
    doStep(g, dir);
  }

  function stepCd(g) { return g.ups.boots ? CD_STEP * 0.6 : CD_STEP; }

  function doStep(g, dir) {
    const p = g.player, d = DIRS[dir];
    const nx = p.x + d[0], ny = p.y + d[1];
    if (dir === 'left' || dir === 'right') p.face = dir;
    const e = enemyAt(g, nx, ny);
    if (e && g.phase === 'play') { bump(g, e, dir); p.cd = CD_BUMP; return; }
    if (!walkable(g, nx, ny) || e) { p.cd = CD_BLOCK; p.streak = 0; emit(g, { type: 'blocked', dir }); return; }
    // né sát nút
    for (const a of alive(g)) {
      if (a.state === 'wind' && a.tele && a.tele.kind !== 'spawn' && a.wdur - a.wt <= CLOSE_WINDOW &&
          a.tele.tiles.some(t => t[0] === p.x && t[1] === p.y)) {
        g.stats.close++;
        if (g.ups.adren) p.adren = true;
        emit(g, { type: 'close', x: p.x, y: p.y });
        break;
      }
    }
    const fx = p.x, fy = p.y;
    p.x = nx; p.y = ny;
    p.streak = p.lastDir === dir ? p.streak + 1 : 1;
    p.lastDir = dir;
    p.cd = stepCd(g);
    emit(g, { type: 'move', fx, fy, x: nx, y: ny, dir });
    if (g.tut && g.tut.step === 0) { g.tut.step = 1; emit(g, { type: 'tut', step: 1 }); }
  }

  function bump(g, e, dir) {
    const p = g.player, d = DIRS[dir];
    let dmg = 1;
    const charged = g.ups.charge && p.lastDir === dir && p.streak >= 2;
    if (charged) dmg += 2;
    if (p.adren) { dmg += 2; p.adren = false; }
    p.streak = 0; p.lastDir = dir;
    g.stats.hits++;
    const wasSleeping = e.sleep;
    if (e.sleep) e.sleep = false;
    emit(g, { type: 'bump', id: e.id, dir, x: e.x, y: e.y, charged });
    const T = TYPES[e.type];
    let outcome = 'hit';
    const ox = e.x, oy = e.y;
    if (!T.heavy) {
      // húc văng: hủy đòn đang gồng
      e.state = 'idle'; e.tele = null; e.stun = 0.35; e.timer = range(g, T.think);
      const k = g.ups.heavy ? 2 : 1;
      for (let i = 0; i < k; i++) {
        const tx = e.x + d[0], ty = e.y + d[1];
        const t = tile(g, tx, ty);
        if (t === '#') { outcome = 'slam'; dmg += g.ups.wall ? 2 : 1; g.stats.slams++; emit(g, { type: 'slam', id: e.id, x: e.x, y: e.y, dir }); break; }
        if (t === 'V') { e.x = tx; e.y = ty; outcome = 'vent'; break; }
        const f = enemyAt(g, tx, ty);
        if (f) { outcome = 'clonk'; dmg += 1; g.stats.clonks++; emit(g, { type: 'clonk', id: e.id, other: f.id, x: tx, y: ty }); damage(g, f, 1, 'clonk'); break; }
        e.x = tx; e.y = ty; outcome = 'push';
        emit(g, { type: 'push', id: e.id, x: tx, y: ty });
      }
    } else {
      emit(g, { type: 'heavy', id: e.id });
    }
    if (outcome === 'vent') {
      vent(g, e);
    } else {
      damage(g, e, dmg, outcome);
    }
    if (g.ups.chain) {
      const cx = e.dead && e.cause !== 'vent' ? e.x : (outcome === 'vent' ? ox : e.x);
      const cy = e.dead && e.cause !== 'vent' ? e.y : (outcome === 'vent' ? oy : e.y);
      for (const n of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const f = enemyAt(g, cx + n[0], cy + n[1]);
        if (f && f !== e) { emit(g, { type: 'zap', from: [cx, cy], id: f.id }); damage(g, f, 1, 'zap'); }
      }
    }
    if (wasSleeping && g.tut && g.tut.step < 2 && outcome !== 'vent') wakeAll(g);
  }

  function vent(g, e) {
    if (e.dead) return;
    e.dead = true; e.cause = 'vent'; e.deadT = 0; e.state = 'idle'; e.tele = null;
    g.stats.kills++; g.stats.vented++;
    emit(g, { type: 'vent', id: e.id, x: e.x, y: e.y });
    onKill(g, e);
    if (g.ups.decomp) {
      for (const f of alive(g)) {
        if (TYPES[f.type].heavy || manh(f, e) > 2) continue;
        const dx = Math.sign(e.x - f.x), dy = Math.sign(e.y - f.y);
        const mv = Math.abs(e.x - f.x) >= Math.abs(e.y - f.y) ? [dx, 0] : [0, dy];
        const tx = f.x + mv[0], ty = f.y + mv[1];
        const t = tile(g, tx, ty);
        f.state = 'idle'; f.tele = null; f.stun = 0.4;
        if (t === 'V') { f.x = tx; f.y = ty; vent(g, f); }
        else if (t === '.' && !occupied(g, tx, ty)) { f.x = tx; f.y = ty; emit(g, { type: 'push', id: f.id, x: tx, y: ty }); }
      }
    }
  }

  function damage(g, e, n, cause) {
    if (e.dead || n <= 0) return;
    if (e.sleep) e.sleep = false;
    e.hp -= n;
    emit(g, { type: 'dmg', id: e.id, n, x: e.x, y: e.y, cause });
    if (e.hp <= 0) {
      e.dead = true; e.cause = cause; e.deadT = 0; e.tele = null; e.state = 'idle';
      g.stats.kills++;
      if (cause === 'friendly') g.stats.oops++;
      emit(g, { type: 'kill', id: e.id, x: e.x, y: e.y, kind: e.type, cause });
      onKill(g, e);
    }
  }

  function onKill(g, e) {
    const p = g.player;
    p.kills++;
    if (g.ups.leech && p.kills % 3 === 0 && p.hp < p.maxHp) { p.hp++; emit(g, { type: 'heal', n: 1 }); }
    if (g.tut && g.tut.step < 2) wakeAll(g);
    if (e.type === 'queen') {
      for (const f of alive(g)) { f.dead = true; f.cause = 'flee'; f.deadT = 0; emit(g, { type: 'kill', id: f.id, x: f.x, y: f.y, kind: f.type, cause: 'flee' }); }
    }
  }

  function wakeAll(g) {
    g.tut.step = 2;
    for (const f of alive(g)) if (f.sleep) { f.sleep = false; f.timer = 0.9; emit(g, { type: 'wake', id: f.id }); }
    emit(g, { type: 'tut', step: 2 });
  }

  function hurtPlayer(g, src) {
    const p = g.player;
    if (p.inv > 0 || g.phase !== 'play') return;
    p.hp--; p.inv = 0.7;
    if (g.room === 0 && p.hp < 1) p.hp = 1; // khoang 1 không thể thua
    emit(g, { type: 'hurt', hp: p.hp, src: src && src.type });
    if (g.ups.thorns && src && !src.dead) damage(g, src, 2, 'thorns');
    if (p.hp <= 0) { g.phase = 'lost'; g.lostTo = src ? src.type : 'alien'; emit(g, { type: 'lose', to: g.lostTo }); }
  }

  // ---------- alien ----------
  function wind(g, e, kind, tiles) {
    if (!tiles.length) return;
    e.state = 'wind'; e.wt = 0; e.wdur = TYPES[e.type].wind; e.tele = { kind, tiles };
    if (kind !== 'spawn') { const p = g.player; if (p.x < e.x) e.face = 'left'; else if (p.x > e.x) e.face = 'right'; }
    let first = false;
    if (g.tut && g.tut.step === 2 && kind !== 'spawn') { g.tut.step = 3; first = true; }
    emit(g, { type: 'tele', id: e.id, kind, tiles, dur: e.wdur, first });
  }

  function strike(g, e) {
    const tele = e.tele, T = TYPES[e.type];
    e.state = 'idle'; e.tele = null; e.timer = T.recover + 0.1;
    if (!tele) return;
    emit(g, { type: 'strike', id: e.id, kind: tele.kind, tiles: tele.tiles });
    if (tele.kind === 'spawn') {
      for (const t of tele.tiles) {
        if (walkable(g, t[0], t[1]) && !occupied(g, t[0], t[1]) && alive(g).length < MAX_ALIVE)
          addEnemy(g, 'grub', t[0], t[1], { spawnT: 0.25, timer: 0.6 });
      }
      return;
    }
    const p = g.player;
    for (const t of tele.tiles) {
      if (p.x === t[0] && p.y === t[1]) hurtPlayer(g, e);
      const f = enemyAt(g, t[0], t[1]);
      if (f && f !== e) damage(g, f, T.ff, 'friendly');
    }
    if (g.tut && g.tut.step === 3) { g.tut.step = 4; emit(g, { type: 'tut', step: 4 }); }
  }

  function lineFrom(g, x, y, d) {
    const out = [];
    let cx = x + d[0], cy = y + d[1];
    while (inB(cx, cy) && tile(g, cx, cy) !== '#') { out.push([cx, cy]); cx += d[0]; cy += d[1]; }
    return out;
  }

  function spitLine(g, e) {
    const p = g.player;
    if (p.x !== e.x && p.y !== e.y) return null;
    if (manh(e, p) < 2) return null;
    const d = [Math.sign(p.x - e.x), Math.sign(p.y - e.y)];
    const line = lineFrom(g, e.x, e.y, d);
    return line.some(t => t[0] === p.x && t[1] === p.y) ? line : null;
  }

  function ring(g, e, r) {
    const out = [];
    for (let y = e.y - r; y <= e.y + r; y++) for (let x = e.x - r; x <= e.x + r; x++)
      if ((x !== e.x || y !== e.y) && inB(x, y) && tile(g, x, y) !== '#') out.push([x, y]);
    return out;
  }

  function bfsFrom(g, sx, sy, blockEnemies, self) {
    const dist = Array.from({ length: H }, () => Array(W).fill(Infinity));
    dist[sy][sx] = 0;
    const q = [[sx, sy]];
    while (q.length) {
      const [x, y] = q.shift();
      for (const d of Object.values(DIRS)) {
        const nx = x + d[0], ny = y + d[1];
        if (!walkable(g, nx, ny) || dist[ny][nx] !== Infinity) continue;
        if (blockEnemies) { const f = enemyAt(g, nx, ny); if (f && f !== self) continue; }
        dist[ny][nx] = dist[y][x] + 1;
        q.push([nx, ny]);
      }
    }
    return dist;
  }

  function moveTo(g, e, x, y) {
    if (x < e.x) e.face = 'left'; else if (x > e.x) e.face = 'right';
    e.x = x; e.y = y;
    emit(g, { type: 'emove', id: e.id, x, y });
  }

  function moveToward(g, e) {
    const p = g.player;
    let dist = bfsFrom(g, p.x, p.y, true, e);
    let best = null, bd = dist[e.y] && dist[e.y][e.x];
    if (bd === Infinity) { dist = bfsFrom(g, p.x, p.y, false, e); bd = dist[e.y][e.x]; }
    const opts = Object.values(DIRS).map(d => [e.x + d[0], e.y + d[1]])
      .filter(([x, y]) => walkable(g, x, y) && !occupied(g, x, y))
      .map(([x, y]) => ({ x, y, d: dist[y][x] + g.rnd() * 0.3 }));
    for (const o of opts) if (o.d < bd && (!best || o.d < best.d)) best = o;
    if (best) moveTo(g, e, best.x, best.y);
  }

  function spitterMove(g, e) {
    const p = g.player;
    const score = (x, y) => {
      let s = 0;
      const aligned = (x === p.x || y === p.y);
      s += aligned ? 0 : Math.min(Math.abs(x - p.x), Math.abs(y - p.y)) * 2;
      const md = Math.abs(x - p.x) + Math.abs(y - p.y);
      if (md < 2) s += 6;
      if (md > 5) s += 1;
      return s + g.rnd() * 0.5;
    };
    let best = { x: e.x, y: e.y, s: score(e.x, e.y) };
    for (const d of Object.values(DIRS)) {
      const x = e.x + d[0], y = e.y + d[1];
      if (!walkable(g, x, y) || occupied(g, x, y)) continue;
      const s = score(x, y);
      if (s < best.s) best = { x, y, s };
    }
    if (best.x !== e.x || best.y !== e.y) moveTo(g, e, best.x, best.y);
  }

  function act(g, e) {
    const T = TYPES[e.type], p = g.player;
    e.timer = range(g, T.think);
    switch (e.type) {
      case 'grub':
        if (manh(e, p) === 1) return wind(g, e, 'bite', [[p.x, p.y]]);
        return moveToward(g, e);
      case 'spitter': {
        const line = spitLine(g, e);
        if (line) return wind(g, e, 'spit', line);
        return spitterMove(g, e);
      }
      case 'brute':
        if (cheb(e, p) <= 1) return wind(g, e, 'slam', ring(g, e, 1));
        return moveToward(g, e);
      case 'nest': {
        if (alive(g).length >= MAX_ALIVE - 1) return;
        const free = Object.values(DIRS).map(d => [e.x + d[0], e.y + d[1]]).filter(([x, y]) => walkable(g, x, y) && !occupied(g, x, y));
        if (!free.length) return;
        return wind(g, e, 'spawn', [free[Math.floor(g.rnd() * free.length)]]);
      }
      case 'queen': {
        if (cheb(e, p) <= 1) return wind(g, e, 'slam', ring(g, e, 1));
        const pat = ['cross', 'move', 'summon', 'move', 'cross', 'move', 'move'];
        const a = pat[e.pi++ % pat.length];
        if (a === 'cross') {
          const tiles = [];
          for (const d of Object.values(DIRS)) tiles.push(...lineFrom(g, e.x, e.y, d));
          return wind(g, e, 'spit', tiles);
        }
        if (a === 'summon') {
          if (alive(g).length >= 5) return moveToward(g, e);
          const free = ring(g, e, 2).filter(([x, y]) => walkable(g, x, y) && !occupied(g, x, y));
          const pick = [];
          while (free.length && pick.length < 2) pick.push(free.splice(Math.floor(g.rnd() * free.length), 1)[0]);
          return wind(g, e, 'spawn', pick);
        }
        return moveToward(g, e);
      }
    }
  }

  function updEnemy(g, e, dt) {
    if (e.spawnT > 0) { e.spawnT -= dt; return; }
    if (e.sleep) {
      if (manh(e, g.player) === 1) { e.wakeT = (e.wakeT || 0) + dt; if (e.wakeT > 2.5) { e.sleep = false; e.timer = 0.3; emit(g, { type: 'wake', id: e.id }); } }
      return;
    }
    if (e.stun > 0) { e.stun -= dt; return; }
    if (e.state === 'wind') {
      e.wt += dt;
      if (e.wt >= e.wdur) strike(g, e);
      return;
    }
    e.timer -= dt;
    if (e.timer <= 0) act(g, e);
  }

  function update(g, dt) {
    if (g.phase === 'lost' || g.phase === 'won' || g.phase === 'pick') return;
    g.t += dt;
    g.stats.time += dt;
    const p = g.player;
    p.cd = Math.max(0, p.cd - dt);
    p.inv = Math.max(0, p.inv - dt);
    if (p.cd <= 0 && p.queue) { const d = p.queue; p.queue = null; doStep(g, d); }
    for (const e of g.enemies) {
      if (e.dead) { e.deadT += dt; continue; }
      if (g.phase === 'play') updEnemy(g, e, dt);
      if (g.phase !== 'play') break;
    }
    g.enemies = g.enemies.filter(e => !e.dead || e.deadT < 1.2);
    if (g.phase === 'play' && alive(g).length === 0) {
      g.phase = 'cleared'; g.clearT = 0;
      if (p.hp < p.maxHp) { p.hp++; emit(g, { type: 'heal', n: 1 }); }
      emit(g, { type: 'clear', room: g.room });
    }
    if (g.phase === 'cleared') {
      g.clearT += dt;
      if (g.clearT > 1.1) {
        if (g.room >= ROOMS.length - 1) { g.phase = 'won'; emit(g, { type: 'win' }); }
        else { g.phase = 'pick'; g.options = rollOptions(g); emit(g, { type: 'pick', options: g.options }); }
      }
    }
  }

  function rollOptions(g) {
    const pool = UPGRADES.filter(u => u.stack || !g.ups[u.id]).map(u => u.id);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(g.rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    return pool.slice(0, 3);
  }

  function choose(g, id) {
    if (g.phase !== 'pick' || !g.options || g.options.indexOf(id) < 0) return false;
    g.ups[id] = (g.ups[id] || 0) + 1;

  };
  function sfx(k) { try { SFX[k] && SFX[k](); } catch (e) { /* bỏ qua lỗi audio */ } }
  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* không rung được */ } }

  // ---------- bố cục ----------
  function layout() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    SW = window.innerWidth; SH = window.innerHeight;
    cvs.width = Math.round(SW * DPR); cvs.height = Math.round(SH * DPR);
    cvs.style.width = SW + 'px'; cvs.style.height = SH + 'px';
    const top = 88, bot = 72, aw = SW - 28, ah = SH - top - bot;
    TS = Math.max(24, Math.floor(Math.min(aw / VS.W, ah / VS.H, 92)));
    BX = Math.round((SW - TS * VS.W) / 2); BY = Math.round(top + (ah - TS * VS.H) / 2);
    buildBg(); buildBoard();
  }
  function prng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
  function rr(c, x, y, w, h, r) { c.beginPath(); ART.rrect(x, y, w, h, r)(c); }

  function buildBg() {
    bgC = bgC || document.createElement('canvas');
    bgC.width = cvs.width; bgC.height = cvs.height;
    const b = bgC.getContext('2d'); b.setTransform(DPR, 0, 0, DPR, 0, 0);
    b.fillStyle = '#b59b74'; b.fillRect(0, 0, SW, SH);
    const r = prng(77);
    for (let i = 0; i < 10; i++) { b.beginPath(); b.ellipse(r() * SW, r() * SH, 40 + r() * 140, 30 + r() * 90, r() * 3, 0, 7); b.fillStyle = 'rgba(90,60,35,0.06)'; b.fill(); }
    for (let i = 0; i < SW * SH / 260; i++) { b.fillStyle = r() < 0.5 ? 'rgba(80,55,30,0.09)' : 'rgba(255,240,210,0.09)'; const s = 1 + r() * 2.5; b.fillRect(r() * SW, r() * SH, s, s); }
    const gr = b.createRadialGradient(SW / 2, SH / 2, Math.min(SW, SH) * 0.3, SW / 2, SH / 2, Math.max(SW, SH) * 0.75);
    gr.addColorStop(0, 'rgba(43,29,22,0)'); gr.addColorStop(1, 'rgba(43,29,22,0.38)');
    b.fillStyle = gr; b.fillRect(0, 0, SW, SH);
  }

  function buildBoard() {
    if (!g) return;
    PAD = Math.round(TS * 0.38);
    boardC = boardC || document.createElement('canvas');
    const W = TS * VS.W, H = TS * VS.H;
    boardC.width = Math.round((W + PAD * 2) * DPR); boardC.height = Math.round((H + PAD * 2) * DPR);
    const b = boardC.getContext('2d'); b.setTransform(DPR, 0, 0, DPR, PAD * DPR, PAD * DPR);
    const lw = Math.max(2, TS * 0.06), r = prng(g.room * 31 + 5);
    ART.setLW(lw);
    // vỏ thuyền
    rr(b, -PAD * 0.8, -PAD * 0.8, W + PAD * 1.6, H + PAD * 1.6, TS * 0.32);
    b.fillStyle = '#5d5846'; b.fill(); b.lineWidth = lw * 1.3; b.strokeStyle = INK; b.stroke();
    rr(b, -PAD * 0.8, -PAD * 0.8, W + PAD * 1.6, H + PAD * 1.6, TS * 0.32);
    b.save(); b.clip(); b.fillStyle = 'rgba(255,240,210,0.1)'; b.fillRect(-PAD, -PAD, W + PAD * 2, PAD * 0.9); b.restore();
    for (let i = 0; i <= VS.W; i++) for (const yy of [-PAD * 0.4, H + PAD * 0.4]) ART.dot(b, i * TS, yy, TS * 0.04, '#3e3a2e');
    for (let j = 1; j < VS.H; j++) for (const xx of [-PAD * 0.4, W + PAD * 0.4]) ART.dot(b, xx, j * TS, TS * 0.04, '#3e3a2e');
    // sàn
    for (let y = 0; y < VS.H; y++) for (let x = 0; x < VS.W; x++) {
      const X = x * TS, Y = y * TS, t = g.grid[y][x];
      b.fillStyle = (x + y) % 2 ? '#a59c7c' : '#9c9374'; b.fillRect(X, Y, TS, TS);
      b.fillStyle = 'rgba(255,245,220,0.16)'; b.fillRect(X, Y, TS, TS * 0.07); b.fillRect(X, Y, TS * 0.07, TS);
      b.fillStyle = 'rgba(43,29,22,0.16)'; b.fillRect(X, Y + TS * 0.93, TS, TS * 0.07); b.fillRect(X + TS * 0.93, Y, TS * 0.07, TS);
      for (const [dx, dy] of [[0.15, 0.15], [0.85, 0.15], [0.15, 0.85], [0.85, 0.85]]) ART.dot(b, X + TS * dx, Y + TS * dy, TS * 0.028, 'rgba(43,29,22,0.35)');
      if (r() < 0.35) { b.beginPath(); b.ellipse(X + TS * (0.3 + r() * 0.4), Y + TS * (0.3 + r() * 0.4), TS * (0.08 + r() * 0.12), TS * (0.05 + r() * 0.08), r() * 3, 0, 7); b.fillStyle = 'rgba(70,50,30,0.13)'; b.fill(); }
      if (t === '#') crate(b, X, Y, lw, r);
      if (t === 'V') ventBase(b, X, Y, lw);
    }
    b.strokeStyle = 'rgba(43,29,22,0.4)'; b.lineWidth = Math.max(1, lw * 0.4);
    for (let i = 1; i < VS.W; i++) { b.beginPath(); b.moveTo(i * TS, 0); b.lineTo(i * TS, H); b.stroke(); }
    for (let j = 1; j < VS.H; j++) { b.beginPath(); b.moveTo(0, j * TS); b.lineTo(W, j * TS); b.stroke(); }
    b.lineWidth = lw; b.strokeStyle = INK; b.strokeRect(0, 0, W, H);
  }

  function crate(b, X, Y, lw, r) {
    const m = TS * 0.07, w = TS - m * 2, top = TS * 0.2;
    ART.setLW(lw);
    b.fillStyle = 'rgba(43,29,22,0.3)'; b.fillRect(X + m + TS * 0.05, Y + m + TS * 0.06, w, w);
    ART.blob(b, ART.rrect(X + m, Y + m, w, w, TS * 0.06), '#b98a45', '#9a7034', TS);
    ART.blob(b, ART.rrect(X + m, Y + m, w, top, TS * 0.05), '#d3a65d', null, TS, lw * 0.8);
    const yy = Y + m + top;
    ART.line(b, [X + m + TS * 0.08, yy + TS * 0.06, X + m + w - TS * 0.08, Y + m + w - TS * 0.06], lw * 1.6, '#7a5230');
    ART.line(b, [X + m + w - TS * 0.08, yy + TS * 0.06, X + m + TS * 0.08, Y + m + w - TS * 0.06], lw * 1.6, '#7a5230');
    ART.line(b, [X + m + TS * 0.08, yy + TS * 0.06, X + m + w - TS * 0.08, Y + m + w - TS * 0.06], lw * 0.4, INK);
    if (r() < 0.5) { b.font = `800 ${Math.round(TS * 0.16)}px ${FONT}`; b.fillStyle = 'rgba(43,29,22,0.55)'; b.textAlign = 'center'; b.fillText('FRAGILE', X + TS / 2, Y + m + top * 0.75); }
  }

  function ventBase(b, X, Y, lw) {
    const m = TS * 0.05;
    b.save(); rr(b, X + m, Y + m, TS - 2 * m, TS - 2 * m, TS * 0.1); b.clip();
    b.fillStyle = '#d9a53a'; b.fillRect(X, Y, TS, TS);
    b.strokeStyle = INK; b.lineWidth = TS * 0.09;
    for (let k = -TS; k < TS * 2; k += TS * 0.26) { b.beginPath(); b.moveTo(X + k, Y); b.lineTo(X + k - TS, Y + TS); b.stroke(); }
    b.restore();
    rr(b, X + m, Y + m, TS - 2 * m, TS - 2 * m, TS * 0.1); b.lineWidth = lw; b.strokeStyle = INK; b.stroke();
  }

  // ---------- vòng đời ván ----------
  function newRun() {
    g = VS.create((Q.get('seed') | 0) || ((Date.now() % 1000000) | 0));
    parts = []; floats = []; strikes = []; zaps = []; banner = null; endTimer = -1;
    $('pick').classList.remove('show'); $('end').classList.remove('show');
    window.__vs = { g, VS, input };
    buildBoard();
  }

  const cx = x => BX + (x + 0.5) * TS;
  const cy = y => BY + (y + 0.5) * TS;
  const byId = id => g.enemies.find(e => e.id === id);

  function float(text, x, y, opts) {
    floats.push(Object.assign({ text, x, y, t: 0, life: 0.9, size: Math.max(18, TS * 0.36), col: '#efe2c4', vy: -TS * 0.9 }, opts || {}));
  }
  function burst(x, y, n, col, spd, size) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * (spd || TS * 3);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - TS * 1.5, r: (size || TS * 0.07) * (0.6 + Math.random() * 0.8), col, t: 0, life: 0.45 + Math.random() * 0.3, g: TS * 9, kind: 'goo' });
    }
  }
  function sparks(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = TS * (2 + Math.random() * 4);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: TS * 0.05, col: '#f1d36a', t: 0, life: 0.25 + Math.random() * 0.15, g: 0, kind: 'spark' });
    }
  }
  const GOO = { grub: '#a7b86a', spitter: '#8d6a92', brute: '#6e7b4a', nest: '#b9d66a', queen: '#8a5a7a' };

  function drain() {
    const evs = g.events.splice(0);
    const p = g.player;
    for (const ev of evs) {
      switch (ev.type) {
        case 'room':
          // khoang 1 không có banner: để hướng dẫn và nhân vật không bị che
          banner = ev.room === 0 ? null : { t: 0, life: 1.8, big: 'DECK ' + (ev.room + 1), name: ev.name, tip: ev.tip };
          buildBoard(); sfx('room'); break;
        case 'move':
          sfx('step');
          for (let i = 0; i < 3; i++) parts.push({ x: cx(ev.fx), y: cy(ev.fy) + TS * 0.3, vx: (Math.random() - 0.5) * TS, vy: -TS * 0.4, r: TS * 0.05, col: 'rgba(239,226,196,0.8)', t: 0, life: 0.3, g: 0, kind: 'dust' });
          break;
        case 'blocked': p.bonk = { dir: ev.dir, t: 0 }; sfx('tick'); break;
        case 'bump': {
          p.lunge = { dir: ev.dir, t: 0 }; p.swing = 1;
          freeze = Math.max(freeze, 0.05); shake = Math.max(shake, 3);
          const e = byId(ev.id); if (e) e.hit = 0.14;
          const d = VS.DIRS[ev.dir];
          sparks(cx(ev.x) - d[0] * TS * 0.4, cy(ev.y) - d[1] * TS * 0.4, 5);
          if (ev.charged) float('CHARGE!', cx(p.x), cy(p.y) - TS * 0.8, { col: '#d9a53a' });
          sfx('bump'); buzz(15); break;
        }
        case 'heavy': { const e = byId(ev.id); if (e) e.wobble = 0.25; break; }
        case 'slam': {
          const d = VS.DIRS[ev.dir];
          freeze = Math.max(freeze, 0.1); shake = Math.max(shake, 8);
          sparks(cx(ev.x) + d[0] * TS * 0.5, cy(ev.y) + d[1] * TS * 0.5, 12);
          float('SLAM!', cx(ev.x), cy(ev.y) - TS * 0.7, { col: '#d9a53a', size: Math.max(22, TS * 0.44) });
          sfx('slam'); buzz(30); break;
        }
        case 'clonk':
          shake = Math.max(shake, 5); freeze = Math.max(freeze, 0.07);
          float('CLONK!', cx(ev.x), cy(ev.y) - TS * 0.7, { col: '#cfe3d6' }); sparks(cx(ev.x), cy(ev.y), 8); sfx('clonk'); break;
        case 'vent': {
          freeze = Math.max(freeze, 0.1); shake = Math.max(shake, 10);
          float('VENTED!', cx(ev.x), cy(ev.y) - TS * 0.6, { col: '#efe2c4', size: Math.max(28, TS * 0.6), life: 1.2 });
          for (let i = 0; i < 18; i++) { const a = Math.random() * Math.PI * 2, R = TS * (0.8 + Math.random() * 1.2);
            parts.push({ x: cx(ev.x) + Math.cos(a) * R, y: cy(ev.y) + Math.sin(a) * R, tx: cx(ev.x), ty: cy(ev.y), r: TS * 0.04, col: '#efe2c4', t: 0, life: 0.45, kind: 'suck' }); }
          sfx('vent'); buzz(45); break;
        }
        case 'dmg': {
          const e = byId(ev.id); if (e) e.hit = Math.max(e.hit || 0, 0.12);
          float('-' + ev.n, cx(ev.x) + TS * 0.25, cy(ev.y) - TS * 0.5, { col: '#f6efdc', size: Math.max(18, TS * 0.32), life: 0.6 });
          if (e) burst(cx(ev.x), cy(ev.y), 3, GOO[e.type]);
          if (ev.cause === 'friendly') float('OOPS!', cx(ev.x), cy(ev.y) - TS, { col: '#b9d66a' });
          break;
        }
        case 'kill':
          burst(cx(ev.x), cy(ev.y), ev.kind === 'queen' ? 40 : 14, GOO[ev.kind], TS * 3.5, TS * 0.09);
          if (ev.kind === 'queen') { shake = 16; freeze = 0.25; float('QUEEN DOWN!', cx(ev.x), cy(ev.y) - TS, { size: Math.max(30, TS * 0.6), life: 1.6, col: '#d9a53a' }); }
          sfx('splat'); break;
        case 'zap': { const e = byId(ev.id); if (e) zaps.push({ a: [cx(ev.from[0]), cy(ev.from[1])], b: [cx(e.x), cy(e.y)], t: 0 }); sfx('zap'); break; }
        case 'hurt':
          shake = Math.max(shake, 12); hurtFlash = 1; freeze = Math.max(freeze, 0.09);
          float('-1', cx(p.x), cy(p.y) - TS * 0.9, { col: '#c8442f', size: Math.max(24, TS * 0.45) });
          sfx('hurt'); buzz(90); break;
        case 'heal': float('+1', cx(p.x), cy(p.y) - TS * 0.9, { col: '#b9d66a', size: Math.max(24, TS * 0.45) }); sfx('heal'); break;
        case 'tele':
          if (ev.first) { slow = ev.dur * 0.9; slowK = 0.3; }
          break;
        case 'strike':
          strikes.push({ tiles: ev.tiles, kind: ev.kind, t: 0 });
          if (ev.kind === 'slam') shake = Math.max(shake, 5);
          sfx(ev.kind === 'slam' ? 'smash' : ev.kind); break;
        case 'close':
          slow = 0.4; slowK = 0.25;
          float('CLOSE!', cx(p.x), cy(p.y) - TS * 0.9, { col: '#cfe3d6', size: Math.max(22, TS * 0.42) }); sfx('close'); break;
        case 'clear':
          banner = { t: 0, life: 1.3, big: 'DECK CLEAR!', name: '', tip: '' }; sfx('clear'); break;
        case 'pick': setTimeout(() => showPick(ev.options), 120); break;
        case 'win': showEnd(true); break;
        case 'lose': endTimer = 1.1; break;
        case 'wake': { const e = byId(ev.id); if (e) float('!', cx(e.x), cy(e.y) - TS * 0.9, { col: '#d9a53a', size: Math.max(26, TS * 0.5) }); break; }
        case 'chosen': sfx('pick'); break;
      }
    }
  }

  // ---------- overlay ----------
  function showPick(opts) {
    const box = $('cards'); box.innerHTML = '';
    opts.forEach((id, i) => {
      const u = VS.UPGRADES.find(x => x.id === id);
      const owned = g.ups[id] ? ' (again)' : '';
      const b = document.createElement('button'); b.className = 'card';
      b.innerHTML = `<div class="gl" style="background:${UPC[id]}">${u.glyph}</div><div><div class="nm">${u.name}${owned}</div><div class="ds">${u.desc}</div></div>`;
      b.addEventListener('click', () => { audioInit(); if (VS.choose(g, id)) $('pick').classList.remove('show'); });
      b.dataset.key = String(i + 1);
      box.appendChild(b);
    });
    $('pick').classList.add('show');
  }

  const LOSE_TIPS = {
    grub: 'Grubs bite the tile they glare at. Step away when it turns red.',
    spitter: 'Spitters shoot down a whole line. Step sideways out of it.',
    brute: 'Brutes smash all 8 tiles around them. Get out of the square.',
    queen: "The Queen's cross hits her whole row and column.",
    alien: 'Knock aliens into walls for +1 damage, or into vents to kill instantly.',
  };
  function showEnd(win) {
    const s = g.stats, best = +(localStorage.getItem('voidstep.best') || 0);
    if (g.room + (win ? 1 : 0) > best) localStorage.setItem('voidstep.best', g.room + (win ? 1 : 0));
    $('endT').textContent = win ? 'SHIP CLEARED!' : 'EATEN ON DECK ' + (g.room + 1);
    $('endS').textContent = win ? 'The hive is gone. Nice mopping.' : 'Best: deck ' + Math.max(best, g.room + 1) + ' of 6';
    const t = Math.round(s.time);
    $('endStats').innerHTML = [['Time', Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0')], ['Aliens down', s.kills], ['Vented', s.vented],
      ['Slams', s.slams], ['Close dodges', s.close], ['Own goals', s.oops]].map(([a, b]) => `<span>${a}</span><b>${b}</b>`).join('');
    const tip = win ? 'Try another mix of upgrades next run.' : (LOSE_TIPS[g.lostTo] || LOSE_TIPS.alien);
    $('endTip').textContent = tip;
    $('end').classList.add('show');
  }
  $('again').addEventListener('click', () => { audioInit(); newRun(); });

  // ---------- input ----------
  const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  function input(d) { lastInput = rt; audioInit(); VS.step(g, d); }
  addEventListener('keydown', e => {
    const d = KEYS[e.code];
    if ($('pick').classList.contains('show')) {
      const b = document.querySelector(`.card[data-key="${e.key}"]`); if (b) b.click();
      return;
    }
    if ($('end').classList.contains('show')) { if (e.code === 'Space' || e.code === 'Enter') newRun(); return; }
    if (d) { e.preventDefault(); input(d); }
    if (DEV && e.code === 'KeyN') { for (const a of VS.alive(g)) { a.dead = true; a.deadT = 0; } }
  });
  let ptr = null;
  cvs.addEventListener('pointerdown', e => {
    audioInit();
    ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
  });
  addEventListener('pointermove', e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, th = Math.max(22, TS * 0.4);
    if (Math.hypot(dx, dy) >= th) {
      input(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      ptr.x = e.clientX; ptr.y = e.clientY; ptr.moved = true;
    }
  });
  addEventListener('pointerup', e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (!ptr.moved && performance.now() - ptr.t < 350) {
      const p = g.player, dx = e.clientX - cx(p.x), dy = e.clientY - cy(p.y);
      if (Math.hypot(dx, dy) > TS * 0.45) input(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    }
    ptr = null;
  });
  addEventListener('pointercancel', () => { ptr = null; });

  // ---------- vẽ ----------
  function txt(s, x, y, size, fill, align, stroke) {
    ctx.font = `800 ${Math.round(size)}px ${FONT}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * 0.22); ctx.strokeStyle = stroke || INK; ctx.strokeText(s, x, y);
    ctx.fillStyle = fill || '#efe2c4'; ctx.fillText(s, x, y);
  }
  function heart(x, y, r, fill) {
    ctx.beginPath(); ctx.moveTo(x, y + r * 0.95);
    ctx.bezierCurveTo(x - r * 1.7, y - r * 0.15, x - r * 0.7, y - r * 1.45, x, y - r * 0.45);
    ctx.bezierCurveTo(x + r * 0.7, y - r * 1.45, x + r * 1.7, y - r * 0.15, x, y + r * 0.95); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  }
  function bubble(text, x, y, size) {
    ctx.font = `700 ${Math.round(size)}px ${FONT}`;
    const w = ctx.measureText(text).width + size * 1.2, h = size * 1.7;
    x = Math.max(BX - PAD * 0.5 + w / 2, Math.min(BX + TS * VS.W + PAD * 0.5 - w / 2, x));
    rr(ctx, x - w / 2, y - h / 2, w, h, h * 0.35);
    ctx.fillStyle = '#efe2c4'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + size * 0.05);
  }
  function arrow(x, y, dir, size) {
    const d = VS.DIRS[dir], bob = Math.sin(rt * 8) * size * 0.15;
    ctx.save(); ctx.translate(x + d[0] * bob, y + d[1] * bob); ctx.rotate(Math.atan2(d[1], d[0]));
    ctx.beginPath(); ctx.moveTo(size * 0.5, 0); ctx.lineTo(-size * 0.1, -size * 0.45); ctx.lineTo(-size * 0.1, -size * 0.18);
    ctx.lineTo(-size * 0.5, -size * 0.18); ctx.lineTo(-size * 0.5, size * 0.18); ctx.lineTo(-size * 0.1, size * 0.18); ctx.lineTo(-size * 0.1, size * 0.45); ctx.closePath();
    ctx.fillStyle = '#d9a53a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();
  }

  function drawVents() {
    for (let y = 0; y < VS.H; y++) for (let x = 0; x < VS.W; x++) {
      if (g.grid[y][x] !== 'V') continue;
      const X = cx(x), Y = cy(y), R = TS * 0.3;
      ctx.beginPath(); ctx.arc(X, Y, R, 0, Math.PI * 2); ctx.fillStyle = '#1b1726'; ctx.fill();
      ctx.save(); ctx.clip();
      for (let i = 0; i < 7; i++) {
        const a = rt * (0.8 + i * 0.13) + i * 2.1, d = R * ((i * 0.37 + rt * 0.25) % 1);
        ART.dot(ctx, X + Math.cos(a) * d, Y + Math.sin(a) * d, Math.max(1, TS * 0.018), 'rgba(239,226,196,0.9)');
      }
      ctx.strokeStyle = 'rgba(141,106,146,0.6)'; ctx.lineWidth = TS * 0.03;
      for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.arc(X, Y, R * (0.45 + i * 0.3), rt * 2 + i * 2, rt * 2 + i * 2 + 2.2); ctx.stroke(); }
      ctx.restore();
      ctx.beginPath(); ctx.arc(X, Y, R, 0, Math.PI * 2); ctx.lineWidth = Math.max(2, TS * 0.06); ctx.strokeStyle = INK; ctx.stroke();
    }
  }

  function drawTeles() {
    for (const e of g.enemies) {
      if (e.dead || e.state !== 'wind' || !e.tele) continue;
      const p = Math.min(1, e.wt / e.wdur), spawn = e.tele.kind === 'spawn';
      const col = spawn ? '156,196,90' : '200,68,47';
      const near = p > 0.75 && !spawn;
      for (const [x, y] of e.tele.tiles) {
        const X = BX + x * TS, Y = BY + y * TS, m = TS * 0.06, w = TS - 2 * m;
        ctx.fillStyle = `rgba(${col},0.25)`; ctx.fillRect(X + m, Y + m, w, w);
        ctx.save(); ctx.beginPath(); ctx.rect(X + m, Y + m, w, w); ctx.clip();
        ctx.strokeStyle = `rgba(${col},0.5)`; ctx.lineWidth = TS * 0.05;
        const off = (rt * TS * 0.7) % (TS * 0.25);
        for (let k = -TS; k < TS * 2; k += TS * 0.25) { ctx.beginPath(); ctx.moveTo(X + k + off, Y); ctx.lineTo(X + k + off - TS, Y + TS); ctx.stroke(); }
        ctx.restore();
        const s = w * p;
        ctx.fillStyle = `rgba(${col},${0.35 + 0.4 * p})`; ctx.fillRect(X + TS / 2 - s / 2, Y + TS / 2 - s / 2, s, s);
        rr(ctx, X + m, Y + m, w, w, TS * 0.08);
        ctx.lineWidth = Math.max(2, TS * 0.05);
        ctx.strokeStyle = near && Math.floor(rt * 20) % 2 ? '#f6efdc' : (spawn ? 'rgba(60,90,30,0.9)' : 'rgba(110,25,15,0.95)');
        ctx.stroke();
      }
    }
  }

  function drawStrikes(dt) {
    for (const s of strikes) {
      s.t += dt;
      const a = 1 - s.t / 0.3;
      if (a <= 0) continue;
      for (const [x, y] of s.tiles) {
        const X = BX + x * TS, Y = BY + y * TS;
        ctx.fillStyle = s.kind === 'spawn' ? `rgba(185,214,106,${a * 0.6})` : `rgba(246,239,220,${a * 0.75})`;
        ctx.fillRect(X + 2, Y + 2, TS - 4, TS - 4);
        if (s.kind !== 'spawn') {
          ctx.strokeStyle = `rgba(43,29,22,${a})`; ctx.lineWidth = Math.max(2, TS * 0.05);
          for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(X + TS * (0.25 + k * 0.2), Y + TS * 0.2); ctx.lineTo(X + TS * (0.15 + k * 0.2), Y + TS * 0.8); ctx.stroke(); }
        }
      }
    }
    strikes = strikes.filter(s => s.t < 0.3);
  }

  const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d');
  function drawSprite(type, X, Y, s, o, flash) {
    if (!flash) { ctx.save(); ctx.translate(X, Y); ART.draw(ctx, type, s, o); ctx.restore(); return; }
    const size = Math.ceil(s * 2.8 * DPR);
    if (tmp.width < size) { tmp.width = size; tmp.height = size; }
    tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, tmp.width, tmp.height);
    tctx.setTransform(DPR, 0, 0, DPR, size / 2, size * 0.8);
    ART.draw(tctx, type, s, o);
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    tctx.globalCompositeOperation = 'source-atop'; tctx.fillStyle = `rgba(255,250,235,${flash})`; tctx.fillRect(0, 0, size, size);
    tctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(tmp, 0, 0, size, size, X - size / 2 / DPR, Y - size * 0.8 / DPR, size / DPR, size / DPR);
  }

  function pips(e, X, Y) {
    if (e.type === 'queen') return;
    const n = e.maxHp, w = TS * 0.11, gap = TS * 0.03, tot = n * w + (n - 1) * gap;
    for (let i = 0; i < n; i++) {
      rr(ctx, X - tot / 2 + i * (w + gap), Y, w, TS * 0.08, TS * 0.03);
      ctx.fillStyle = i < e.hp ? '#c8442f' : 'rgba(43,29,22,0.35)'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke();
    }
  }

  const HEAD = { player: 0.95, grub: 0.6, spitter: 1.0, brute: 0.85, nest: 0.6, queen: 1.5 };
  function drawEntities(dt) {
    const p = g.player;
    const list = g.enemies.slice();
    list.push(Object.assign(p, { type: 'player', isP: true }));
    list.sort((a, b) => (a.dead ? -1 : 0) - (b.dead ? -1 : 0) || a.ry - b.ry);
    for (const e of list) {
      let X = cx(e.rx), Y = cy(e.ry) + TS * 0.32;
      let sc = 1, rot = 0, alpha = 1;
      if (e.isP) {
        if (p.lunge) { p.lunge.t += dt; const k = Math.sin(Math.min(1, p.lunge.t / 0.13) * Math.PI) * TS * 0.32, d = VS.DIRS[p.lunge.dir]; X += d[0] * k; Y += d[1] * k; if (p.lunge.t > 0.13) p.lunge = null; }
        if (p.bonk) { p.bonk.t += dt; const k = Math.sin(Math.min(1, p.bonk.t / 0.1) * Math.PI) * TS * 0.08, d = VS.DIRS[p.bonk.dir]; X += d[0] * k; Y += d[1] * k; if (p.bonk.t > 0.1) p.bonk = null; }
        if (p.inv > 0 && Math.floor(rt * 18) % 2) alpha = 0.45;
        if (g.phase === 'lost') { rot = Math.max(0, Math.min(1, endTimer < 0 ? 1 : 1.1 - endTimer)) * 1.4; }
      } else {
        if (e.spawnT > 0) {
          const k = Math.min(1, e.spawnT / 0.55);
          ctx.beginPath(); ctx.ellipse(X, Y, TS * 0.3 * (1 - k * 0.6), TS * 0.1 * (1 - k * 0.6), 0, 0, 7); ctx.fillStyle = 'rgba(43,29,22,0.35)'; ctx.fill();
          Y -= k * TS * 3; alpha = 1 - k * 0.5;
        }
        if (e.dead) {
          if (e.cause === 'vent') { const k = Math.min(1, e.deadT / 0.5); sc = 1 - k; rot = k * 9; Y -= TS * 0.3 * k; if (k >= 1) continue; }
          else { const k = Math.min(1, e.deadT / 0.22); sc = 1 + k * 0.3; alpha = 1 - k; if (k >= 1) continue; }
        }
        if (e.state === 'wind' && !e.dead) { const k = e.wt / e.wdur; X += (Math.random() - 0.5) * TS * 0.05 * k; }
        if (e.wobble > 0) { e.wobble -= dt; rot = Math.sin(e.wobble * 60) * 0.08; }
      }
      // bóng
      if (!(e.dead && e.cause === 'vent')) {
        ctx.beginPath(); ctx.ellipse(cx(e.rx), cy(e.ry) + TS * 0.32, TS * (e.type === 'queen' ? 0.45 : e.type === 'brute' ? 0.38 : 0.3) * sc, TS * 0.1 * sc, 0, 0, 7);
        ctx.fillStyle = 'rgba(43,29,22,0.28)'; ctx.fill();
      }
      // hào quang nâng cấp
      if (e.isP && g.phase === 'play') {
        const charged = g.ups.charge && p.streak >= 2, adren = p.adren;
        if (charged || adren) {
          ctx.beginPath(); ctx.ellipse(X, Y - TS * 0.02, TS * 0.38, TS * 0.13, 0, 0, 7);
          ctx.lineWidth = TS * 0.05; ctx.strokeStyle = adren ? 'rgba(200,68,47,0.85)' : 'rgba(217,165,58,0.9)'; ctx.stroke();
        }
      }
      const o = { t: rt + (e.id || 0) * 1.7, face: e.face || 'right', wind: e.state === 'wind' && e.wdur ? e.wt / e.wdur : 0, sleep: e.sleep, swing: e.isP ? p.swing : 0 };
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(X, Y); ctx.rotate(rot); ctx.scale(sc, sc);
      drawSprite(e.type, 0, 0, TS * 1.15, o, e.hit > 0 ? 0.85 : 0);
      ctx.restore();
      if (!e.isP && !e.dead && e.spawnT <= 0) {
        pips(e, cx(e.rx), cy(e.ry) - TS * (HEAD[e.type] || 0.8) * 0.62 - TS * 0.3);
        if (e.sleep) txt('z', X + TS * 0.25 + Math.sin(rt * 2) * 4, Y - TS * 0.75 - (rt * 10 % 10), Math.max(16, TS * 0.28), '#cfe3d6');
      }
      if (e.hit > 0) e.hit -= dt;
    }
    p.swing = Math.max(0, (p.swing || 0) - dt * 6);
  }

  function drawParts(dt) {
    for (const q of parts) {
      q.t += dt;
      const a = 1 - q.t / q.life;
      if (a <= 0) continue;
      if (q.kind === 'suck') {
        const k = Math.min(1, q.t / q.life); const x = q.x + (q.tx - q.x) * k, y = q.y + (q.ty - q.y) * k;
        ctx.strokeStyle = `rgba(239,226,196,${a})`; ctx.lineWidth = Math.max(2, TS * 0.04);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (q.x - q.tx) * 0.15, y + (q.y - q.ty) * 0.15); ctx.stroke();
        continue;
      }
      q.vy += (q.g || 0) * dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.kind === 'spark') {
        ctx.strokeStyle = `rgba(241,211,106,${a})`; ctx.lineWidth = Math.max(2, TS * 0.04);
        ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03); ctx.stroke();
      } else if (q.kind === 'dust') {
        ctx.globalAlpha = a; ART.dot(ctx, q.x, q.y, q.r * (1 + q.t * 3), q.col); ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = Math.min(1, a * 1.5);
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fillStyle = q.col; ctx.fill(); ctx.lineWidth = Math.max(1.5, TS * 0.025); ctx.strokeStyle = INK; ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    parts = parts.filter(q => q.t < q.life);
    for (const z of zaps) {
      z.t += dt; const a = 1 - z.t / 0.2; if (a <= 0) continue;
      ctx.strokeStyle = `rgba(207,227,214,${a})`; ctx.lineWidth = Math.max(2, TS * 0.05); ctx.beginPath(); ctx.moveTo(z.a[0], z.a[1]);
      for (let i = 1; i < 5; i++) { const k = i / 5; ctx.lineTo(z.a[0] + (z.b[0] - z.a[0]) * k + (Math.random() - 0.5) * TS * 0.25, z.a[1] + (z.b[1] - z.a[1]) * k + (Math.random() - 0.5) * TS * 0.25); }
      ctx.lineTo(z.b[0], z.b[1]); ctx.stroke();
    }
    zaps = zaps.filter(z => z.t < 0.2);
  }

  function drawFloats(dt) {
    for (const f of floats) {
      f.t += dt;
      const k = f.t / f.life; if (k >= 1) continue;
      const pop = k < 0.15 ? 0.6 + k / 0.15 * 0.6 : 1.2 - Math.min(0.2, (k - 0.15));
      ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      txt(f.text, f.x, f.y + f.vy * Math.min(k, 0.5) * 0.6, f.size * pop, f.col);
      ctx.globalAlpha = 1;
    }
    floats = floats.filter(f => f.t < f.life);
  }

  function drawHints() {
    if (!g.tut || g.phase !== 'play') return;
    const p = g.player, size = Math.max(16, Math.min(22, TS * 0.3));
    const idle = rt - lastInput > 6;
    if (g.tut.step === 0) {
      arrow(cx(p.x), cy(p.y) - TS * 0.95, 'up', TS * 0.55);
      bubble(TOUCH ? 'Swipe to step' : 'Swipe or arrow keys', cx(p.x), cy(p.y) + TS * 0.95, size);
    } else if (g.tut.step === 1) {
      const e = g.enemies.find(a => a.sleep && !a.dead && a.y < 4);
      if (e) {
        ctx.beginPath(); ctx.arc(cx(e.x), cy(e.y), TS * (0.48 + Math.sin(rt * 6) * 0.04), 0, 7); ctx.lineWidth = 3; ctx.strokeStyle = '#d9a53a'; ctx.stroke();
        if (p.x === e.x && p.y === e.y + 1) arrow(cx(e.x), cy(e.y) + TS * 0.55, 'up', TS * 0.45);
        else if (idle || p.y > e.y + 1 || p.x !== e.x) arrow(cx(e.x), cy(e.y) + TS * 1.5, 'up', TS * 0.45);
        bubble('Bump it into the vent!', cx(e.x), cy(e.y) + TS * 2.6, size);
      }
    } else if (g.tut.step === 3) {
      const e = g.enemies.find(a => a.state === 'wind' && a.tele && a.tele.kind !== 'spawn');
      if (e) bubble('Red = danger. Step off!', cx(e.tele.tiles[0][0]), cy(e.tele.tiles[0][1]) - TS * 0.9, size);
    } else if (g.tut.step === 4 && VS.alive(g).length) {
      bubble('Bonk it into a wall or vent!', BX + TS * VS.W / 2, BY + TS * VS.H + PAD * 0.2 + size, size);
    }
  }

  function drawHUD() {
    const p = g.player, top = 14;
    const r = Math.max(11, Math.min(15, SW / 34));
    const hx0 = Math.max(16, BX - PAD * 0.4) + r;
    for (let i = 0; i < p.maxHp; i++) {
      const lowPulse = p.hp <= 2 && i < p.hp ? 1 + Math.sin(rt * 10) * 0.08 : 1;
      heart(hx0 + i * r * 2.35, top + 22, r * lowPulse, i < p.hp ? '#c8442f' : '#7a6a55');
    }
    const rx = Math.min(SW - 16, BX + TS * VS.W + PAD * 0.4);
    txt('DECK ' + (g.room + 1) + '/' + VS.ROOMS.length, rx, top + 20, 24, '#efe2c4', 'right');
    ctx.font = `700 16px ${FONT}`; ctx.textAlign = 'right'; ctx.fillStyle = INK;
    ctx.fillText(VS.ROOMS[g.room].name, rx, top + 46);
    const left = VS.alive(g).length;
    txt('Aliens: ' + left, hx0 - r, top + 54, 18, '#efe2c4', 'left');
    // thanh máu Alien Chúa
    const q = g.enemies.find(e => e.type === 'queen' && !e.dead);
    if (q) {
      const w = TS * VS.W, y = BY - PAD - 4, x = BX;
      rr(ctx, x, y - 14, w, 14, 7); ctx.fillStyle = 'rgba(43,29,22,0.5)'; ctx.fill();
      rr(ctx, x, y - 14, w * Math.max(0, q.hp) / q.maxHp, 14, 7); ctx.fillStyle = '#8a5a7a'; ctx.fill();
      rr(ctx, x, y - 14, w, 14, 7); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      txt('BROOD QUEEN', BX + w / 2, y - 7, 15, '#efe2c4');
    }
    // nâng cấp đang có
    const ids = Object.keys(g.ups);
    if (ids.length) {
      const R = 18, gap = 8, tot = ids.length * (R * 2 + gap) - gap, y = Math.min(SH - R - 10, BY + TS * VS.H + PAD + R + 6);
      ids.forEach((id, i) => {
        const x = SW / 2 - tot / 2 + R + i * (R * 2 + gap);
        ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fillStyle = UPC[id]; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
        txt(VS.UPGRADES.find(u => u.id === id).glyph, x, y + 1, 20, '#efe2c4');
        if (g.ups[id] > 1) txt('x' + g.ups[id], x + R * 0.9, y + R * 0.7, 13, '#d9a53a');
      });
    }
  }

  function drawBanner(dt) {
    if (!banner) return;
    banner.t += dt;
    const k = banner.t / banner.life;
    if (k >= 1) { banner = null; return; }
    const a = k < 0.1 ? k / 0.1 : k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
    // có khoảng trống trên bàn (màn dọc) thì đặt banner ở đó, không che sàn
    const gap = BY - PAD - 76;
    const big = Math.max(30, Math.min(58, TS * 0.75));
    const X = BX + TS * VS.W / 2;
    const Y = gap > big * 1.6 ? 76 + gap * 0.3 : BY + TS * VS.H * 0.42;
    ctx.globalAlpha = a;
    txt(banner.big, X, Y, big * (k < 0.1 ? 0.8 + k * 2 : 1), '#efe2c4');
    if (banner.name) txt(banner.name, X, Y + big * 0.85, big * 0.5, '#d9a53a');
    if (banner.tip) bubble(banner.tip, X, Y + big * 1.65, Math.max(16, big * 0.36));
    ctx.globalAlpha = 1;
  }

  // ---------- vòng lặp ----------
  let last = performance.now();
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000); last = now;
    rt += dt;
    let ldt = dt;
    if (freeze > 0) { freeze -= dt; ldt = 0; } else if (slow > 0) { slow -= dt; ldt = dt * slowK; }
    VS.update(g, ldt);
    drain();
    if (endTimer > 0) { endTimer -= dt; if (endTimer <= 0) { endTimer = -1; showEnd(false); } }
    const k = Math.min(1, dt * 24);
    for (const e of [g.player].concat(g.enemies)) {
      if (e.rx === undefined) { e.rx = e.x; e.ry = e.y; }
      e.rx += (e.x - e.rx) * k; e.ry += (e.y - e.ry) * k;
    }
    shake = Math.max(0, shake - dt * 45); hurtFlash = Math.max(0, hurtFlash - dt * 2.5);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(bgC, 0, 0, SW, SH);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    if (boardC) ctx.drawImage(boardC, BX - PAD, BY - PAD, TS * VS.W + PAD * 2, TS * VS.H + PAD * 2);
    drawVents();
    drawTeles();
    drawStrikes(dt);
    drawEntities(dt);
    drawParts(dt);
    drawFloats(dt);
    drawHints();
    drawBanner(dt);
    ctx.restore();
    drawHUD();
    if (hurtFlash > 0) {
      const gr = ctx.createRadialGradient(SW / 2, SH / 2, Math.min(SW, SH) * 0.25, SW / 2, SH / 2, Math.max(SW, SH) * 0.7);
      gr.addColorStop(0, 'rgba(200,68,47,0)'); gr.addColorStop(1, `rgba(200,68,47,${0.5 * hurtFlash})`);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, SW, SH);
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', layout);
  newRun();
  layout();
  if (document.fonts && document.fonts.load) document.fonts.load(`800 20px ${FONT}`).then(buildBoard).catch(() => {});
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
